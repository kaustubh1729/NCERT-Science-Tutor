[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ncert-science-tutor"
version = "2.0.0"
description = "Hybrid-retrieval question answering over the NCERT Science textbooks (classes 6-10)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Krishna Kanojiya", email = "krishna.cs96.ai@gmail.com" }]
keywords = ["rag", "retrieval", "ncert", "education", "hybrid-search", "reranking"]

# 3.10 is the floor: the codebase uses PEP 604 unions (`int | None`) at runtime in
# dataclass field annotations, which 3.9 cannot evaluate even with
# `from __future__ import annotations`.
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are pinned in requirements.txt rather than duplicated here.
# Keeping two lists in sync by hand is a reliable way to have them disagree; the
# requirements files are the single source, split by what each context actually
# needs (serve / local embeddings / dev).
dependencies = []

[project.optional-dependencies]
local = ["torch>=2.0", "sentence-transformers>=3.0", "langchain-huggingface>=0.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.urls]
Homepage = "https://github.com/KRISHNA-12082006/Science_NCERT"
Documentation = "https://github.com/KRISHNA-12082006/Science_NCERT/tree/main/docs"
Repository = "https://github.com/KRISHNA-12082006/Science_NCERT"
Issues = "https://github.com/KRISHNA-12082006/Science_NCERT/issues"

[project.scripts]
ncert-tutor = "app.main:main"
ncert-build-index = "scripts.build_index:main"
ncert-preflight = "scripts.preflight:main"

[tool.setuptools.packages.find]
include = ["src*", "app*", "scripts*"]

# ------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: needs the committed index or a model load",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::FutureWarning:transformers.*",
]

# ------------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["ncert", ".venv", "db", "cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is checked by the formatter, not the linter
    "B008",    # dataclass field(default_factory=...) is the intended pattern here
    "RUF012",  # ClassVar annotations add noise on simple constant maps
]

[tool.ruff.lint.per-file-ignores]
# Entrypoints must set os.environ before the transformers import chain runs, so
# imports cannot all sit at the top of the file.
"app/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"eval/*.py" = ["E402"]
# Tests use assert and may shadow builtins in fixtures.
"tests/*.py" = ["B011", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["src", "app", "scripts"]

# ------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# The LangChain/Chroma surface is largely untyped, so strict mode would produce
# noise rather than signal. These two catch the errors that actually occur.
check_untyped_defs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "langchain_*.*", "cohere.*", "fitz.*", "ragas.*", "datasets.*"]
ignore_missing_imports = true
